[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "publii-agent-toolkit"
version = "1.1.0"
description = "Read and edit a Publii CMS site from code, safely enough to hand to an AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mathieu Brassard" }]
keywords = ["publii", "cms", "static-site", "ai-agent", "automation", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Driving the Publii desktop application. Windows only, so it stays optional:
# the core toolkit keeps pydantic as its single runtime dependency.
desktop = ["pywinauto>=0.6.8; sys_platform == 'win32'"]

[project.scripts]
publii-agent = "publii_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/iMathieuB/publii-agent-toolkit"
Issues = "https://github.com/iMathieuB/publii-agent-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
